<!-- *ngIf="showForm" -->
<div class="container mt-5" *ngIf="showForm">
    <div class="row justify-content-center">
      <div class="col-md-6 col-lg-5">
        <form (ngSubmit)="submit()" #addresscategoryForm="ngForm" novalidate>
          <div class="card shadow rounded-4 p-4">
            <h5 class="mb-4 text-center">Add Address Type</h5>
  
            <div class="mb-3">
              <label for="addressCategoryName" class="form-label">Address Category Name</label>
              <input
                type="text"
                id="addressCategoryName"
                class="form-control"
                name="addressCategoryName"
                [(ngModel)]="addressCategory.addressCategoryName"
                required
                #addressCategoryName="ngModel"
              />
              <div class="invalid-feedback d-block" *ngIf="addressCategoryName.invalid && addressCategoryName.touched">
                Address Category is required.
              </div>
            </div>
  
            <div class="d-flex gap-2">
                <button
                  type="submit"
                  class="btn btn-primary w-50"
                  [disabled]="addresscategoryForm.invalid"
                >
                  Save
                </button>
                <!-- Cancel Button -->
  <button
  type="button"
  class="btn btn-secondary w-50"
  (click)="cancel()"
>
  Cancel
</button>
                
              </div>
          </div>
        </form>
      </div>
    </div>
  </div>
